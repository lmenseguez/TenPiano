<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TenPiano</title>
  <meta name="description" content="Práctica diaria de lectura de partituras para piano.">
  <meta name="theme-color" content="#030b1f">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TenPiano">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <noscript>Esta app necesita JavaScript para funcionar.</noscript>
  <script>
    // Si la app no llega a mostrarse (por ejemplo, justo después de una actualización,
    // cuando el navegador mezcla archivos viejos y nuevos), ofrece recargar limpiando la copia guardada.
    window.addEventListener('load', function () {
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || app.children.length) return;
        app.innerHTML = '<div class="card stack"><h2>La app se está actualizando</h2>' +
          '<p>Toca el botón para cargar la versión nueva. Tu progreso no se pierde.</p>' +
          '<button class="btn btn-primary" id="fix">Recargar</button>' +
          '<p class="small muted">Si vuelve a aparecer este mensaje, espera un par de minutos y prueba de nuevo.</p></div>';
        document.getElementById('fix').onclick = function () {
          var go = function () { location.replace(location.pathname + '?r=' + Date.now()); };
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).then(go, go);
        };
      }, 2500);
    });
  </script>
  <script src="vendor/vexflow.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
